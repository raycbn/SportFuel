[build]
  command = "npm run build"
  publish = "dist"

# The Netlify Git integration must use the production canonical host too.
# File-based config overrides any stale VITE_SITE_URL stored in the UI.
[build.environment]
  VITE_SITE_URL = "https://fuel.pedalmap.es"

# Apply security headers to HTML and static assets. CSP starts in Report-Only
# so we can inspect browser violations before enforcing it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://pedalmap-api.broken-dietician.workers.dev https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.googleapis.com https://*.firebaseapp.com https://firebasestorage.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self';"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
